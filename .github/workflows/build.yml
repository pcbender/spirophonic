# .github/workflows/build.yml
name: Check Spirophonic

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web-prototype:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build

  python:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v8
        with:
          version: "0.8.20"
          enable-cache: true

      - run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - run: uv sync --locked --dev --extra align
      - run: uv run ruff check .
      - run: uv run pytest
